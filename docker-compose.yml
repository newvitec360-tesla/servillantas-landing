services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: servillantas_cartera
      MYSQL_USER: servillantas
      MYSQL_PASSWORD: servillantas
    ports:
      - "3307:3306"
    volumes:
      - servillantas_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seed_demo.sql:/docker-entrypoint-initdb.d/02_seed_demo.sql

volumes:
  servillantas_db:
